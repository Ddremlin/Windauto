name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # автотесты интерфейса: своя сборка + настоящий сервер, браузер как у телефона (Pixel 7).
  # В образе Playwright — браузер уже стоит (версия образа = @playwright/test в package.json)
  e2e:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm ci --omit=dev
        working-directory: server
      - run: npm run e2e
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  deploy:
    needs: e2e
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --omit=dev
        working-directory: server
      - run: npm test
      - run: npm run build
      # веб-версия переехала на https://app.dmerlinauto.vip: здесь — страница переезда,
      # а прежняя версия — в old/, чтобы дослать изменения, не успевшие уйти на сервер
      - run: |
          mkdir pages
          mv dist pages/old
          cp pages-redirect/index.html pages/index.html
          touch pages/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
