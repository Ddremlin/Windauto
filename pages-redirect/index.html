<!doctype html>
<!--
  Веб-версия Windauto переехала на https://app.dmerlinauto.vip — на один адрес с сервером.
  Здесь, на ddremlin.github.io, общем для всех проектов на GitHub Pages, токен входа больше не храним:
  если всё отправлено на сервер — стираем токен и уходим на новый адрес; если нет — даём дослать
  из прежней версии (old/), у неё те же данные этого браузера.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Windauto переехал</title>
<style>
:root{--bg:#f3f4f6;--panel:#fff;--text:#15181d;--muted:#6b7280;--line:#d9dde3;--accent:#0f62fe;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#1a1d23;--text:#e8eaed;--muted:#9aa0a8;--line:#2d323a;--accent:#4c8dff;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
h1{font-size:22px;margin:0 0 12px}.muted{color:var(--muted)}
a.btn{display:block;text-align:center;margin-top:12px;padding:12px;border-radius:10px;font-weight:600;text-decoration:none;background:var(--accent);color:#fff}
a.btn.second{background:transparent;color:var(--accent);border:1px solid var(--line)}
[hidden]{display:none}
</style>
</head>
<body>
<main><div class="card">
  <h1 data-ru="Windauto переехал" data-pl="Windauto ma nowy adres">Windauto переехал</h1>
  <p data-ru="Новый адрес:" data-pl="Nowy adres:">Новый адрес:</p>
  <p><b>app.dmerlinauto.vip</b></p>
  <div id="pending" hidden>
    <p data-ru="В этом браузере есть изменения, которые ещё не ушли на сервер. Откройте прежнюю версию, дождитесь отправки, затем вернитесь сюда."
       data-pl="W tej przeglądarce są zmiany, które nie trafiły jeszcze na serwer. Otwórz poprzednią wersję, poczekaj na wysłanie i wróć tutaj."></p>
    <a class="btn" href="./old/" data-ru="Открыть прежнюю версию и отправить" data-pl="Otwórz poprzednią wersję i wyślij"></a>
  </div>
  <a class="btn" id="go" href="https://app.dmerlinauto.vip/" data-ru="Перейти на новый адрес" data-pl="Przejdź pod nowy adres"></a>
  <p class="muted" data-ru="Войдите там тем же логином и паролем — заказы загрузятся с сервера."
     data-pl="Zaloguj się tym samym loginem i hasłem — zlecenia pobiorą się z serwera."></p>
</div></main>
<script>
  const KEY = 'windauto.sync.v1'
  let s = {}
  try { s = JSON.parse(localStorage.getItem(KEY) || '{}') } catch {}
  let lang = 'ru'
  try { lang = JSON.parse(localStorage.getItem('windauto.settings.v1') || '{}').lang || (/^pl/i.test(navigator.language) ? 'pl' : 'ru') } catch {}
  for (const el of document.querySelectorAll('[data-ru]')) el.textContent = el.dataset[lang] || el.dataset.ru
  const target = 'https://app.dmerlinauto.vip/' + location.hash
  document.getElementById('go').href = target
  // прежний service worker больше не нужен
  navigator.serviceWorker?.getRegistrations().then((rs) => rs.forEach((r) => r.scope.endsWith('/old/') || r.unregister())).catch(() => {})
  const pending = Object.keys(s.dirty || {}).length + Object.keys(s.deleted || {}).length + (s.sharedDirty ? 1 : 0)
  if (s.token && pending) document.getElementById('pending').hidden = false
  else {
    // всё на сервере — токен здесь больше не храним
    if (s.token) {
      s.token = ''
      try { localStorage.setItem(KEY, JSON.stringify(s)) } catch {}
    }
    location.replace(target)
  }
</script>
</body>
</html>
