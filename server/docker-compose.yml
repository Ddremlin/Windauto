# Windauto: сервер синхронизации + Caddy (HTTPS с автоматическим сертификатом)
# Запуск: DOMAIN=1.2.3.4.sslip.io docker compose up -d
# журналы контейнеров: не больше 3 файлов по 10 МБ, иначе со временем заполнят диск
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  api:
    build: .
    restart: unless-stopped
    logging: *logging
    environment:
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # распознавание VIN/номера по фото; пусто — выключено
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      # адрес сервера в ссылках из писем, например https://app.windauto.pl
      PUBLIC_URL: ${PUBLIC_URL:-}
      # письма (подтверждение email, сброс пароля, приглашения) через Brevo; пусто — только в журнал
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      # регистрация новых компаний; off — закрыта
      REGISTRATION: ${REGISTRATION:-}
      # оператор сервиса — в политике конфиденциальности и условиях
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
      OPERATOR_NIP: ${OPERATOR_NIP:-}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      # «Помощь» → «Написать разработчику»: e-mail (иначе OPERATOR_EMAIL) и бот Telegram
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # оплата Pro через Stripe (карта, BLIK); пусто — кнопок оплаты нет. См. README → «Оплата»
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MONTH: ${STRIPE_PRICE_MONTH:-}
      STRIPE_PRICE_YEAR: ${STRIPE_PRICE_YEAR:-}
      STRIPE_TAX_RATE: ${STRIPE_TAX_RATE:-}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-}
      # цены на экране «Тариф» (zł netto) — должны совпадать с ценами в Stripe
      PRICE_MONTH_PLN: ${PRICE_MONTH_PLN:-79}
      PRICE_YEAR_PLN: ${PRICE_YEAR_PLN:-790}
      # лимиты: место Pro / бесплатно (ГБ), вызовов ИИ в месяц
      ORG_QUOTA_GB: ${ORG_QUOTA_GB:-50}
      FREE_QUOTA_GB: ${FREE_QUOTA_GB:-1}
      AI_PER_MONTH: ${AI_PER_MONTH:-500}
      # уборка фото/видео без заказа: старше скольких дней; 1 — удалить, даже если без заказа больше половины файлов
      MEDIA_GRACE_DAYS: ${MEDIA_GRACE_DAYS:-14}
      MEDIA_SWEEP_FORCE: ${MEDIA_SWEEP_FORCE:-}
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN, например 1.2.3.4.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # веб-версия приложения (npm run build → dist/ сюда)
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
